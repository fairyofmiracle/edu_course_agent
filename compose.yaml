services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@db:5432/${POSTGRES_DB:-studio}
      ROOT_PATH: /backend
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:?Укажите STUDIO_API_TOKEN в .env}
      GIGASCHOOL_BASE_URL: ${GIGASCHOOL_BASE_URL:-}
      GIGASCHOOL_API_KEY: ${GIGASCHOOL_API_KEY:-}
      CLOUDRU_BASE_URL: ${CLOUDRU_BASE_URL:-}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-GigaChat/GigaChat-3-Pro}
      CLOUDRU_MODEL_WRITER: ${CLOUDRU_MODEL_WRITER:-GigaChat/GigaChat-3-Pro}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_CONCURRENCY: ${GATEWAY_CONCURRENCY:-2}
      LLM_TOKEN_BUDGET: ${LLM_TOKEN_BUDGET:-25000}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "sh",
        "-c",
        "celery -A backend.app.gateway_queue.celery_app worker --loglevel=INFO --concurrency=$${GATEWAY_CONCURRENCY:-2}",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@db:5432/${POSTGRES_DB:-studio}
      GIGASCHOOL_BASE_URL: ${GIGASCHOOL_BASE_URL:-}
      GIGASCHOOL_API_KEY: ${GIGASCHOOL_API_KEY:-}
      CLOUDRU_BASE_URL: ${CLOUDRU_BASE_URL:-}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-GigaChat/GigaChat-3-Pro}
      CLOUDRU_MODEL_WRITER: ${CLOUDRU_MODEL_WRITER:-GigaChat/GigaChat-3-Pro}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_CONCURRENCY: ${GATEWAY_CONCURRENCY:-2}
      LLM_TOKEN_BUDGET: ${LLM_TOKEN_BUDGET:-25000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_PYTHON_API_URL: /backend
        PYTHON_AGENT_URL: http://api:8000
    environment:
      PYTHON_AGENT_URL: http://api:8000
      NEXT_PUBLIC_PYTHON_API_URL: /backend
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:?Укажите STUDIO_API_TOKEN в .env}
    ports:
      - "8000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
